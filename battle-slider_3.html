<div class="slider-section">    
    <div class="battle-slider-container">
        <div class="battle-slider">
            <div class="slide fade">
                <div class="slide-number">1/5</div>
                <img src="day3_1.png" alt="Bhishma leading the Kaurava army">
                <div class="fullscreen-button" onclick="openFullscreen('day3_1.png')">⛶</div>
            </div>
            
            <div class="slide fade">
                <div class="slide-number">2/5</div>
                <img src="day3_2.png" alt="Bhishma's arrow storm">
                <div class="fullscreen-button" onclick="openFullscreen('day3_2.png')">⛶</div>
            </div>
            
            <div class="slide fade">
                <div class="slide-number">3/5</div>
                <img src="day3_3.png" alt="Battlefield carnage">
                <div class="fullscreen-button" onclick="openFullscreen('day3_3.png')">⛶</div>
            </div>
            
            <div class="slide fade">
                <div class="slide-number">4/5</div>
                <img src="day3_4.png" alt="Pandava warriors struggling">
                <div class="fullscreen-button" onclick="openFullscreen('day3_4.png')">⛶</div>
            </div>
            
            <div class="slide fade">
                <div class="slide-number">5/5</div>
                <img src="day3_5.png" alt="Shikhandi approaching">
                <div class="fullscreen-button" onclick="openFullscreen('day3_5.png')">⛶</div>
            </div>
            
            <!-- Navigation arrows -->
            <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
            <a class="next" onclick="changeSlide(1)">&#10095;</a>
        </div>
        
        <!-- Navigation dots -->
        <div class="dots-container">
            <span class="dot" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
            <span class="dot" onclick="currentSlide(3)"></span>
            <span class="dot" onclick="currentSlide(4)"></span>
            <span class="dot" onclick="currentSlide(5)"></span>
        </div>
    </div>
</div>

<!-- Fullscreen overlay -->
<div id="fullscreen-overlay" class="fullscreen-overlay">
    <span class="close-fullscreen" onclick="closeFullscreen()">&times;</span>
    <div class="fullscreen-content">
        <img id="fullscreen-image" src="">
    </div>
</div>
